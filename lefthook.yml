# Git hooks. `npm install` installs them (the `prepare` script).
# A cloud agent commits with no git hooks, so CI runs every check again.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,json,md,yml,yaml,css,html}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.js'
      run: npx eslint --no-warn-ignored {staged_files}
    # Claude Code reads AGENTS.md only when no CLAUDE.md exists in the folder or above it.
    no-claude-md:
      glob: ['CLAUDE.md', '**/CLAUDE.md']
      # The staged files include deleted ones: a delete is allowed. Single quotes only: on Windows,
      # Lefthook wraps the whole command in double quotes.
      run: for file in {staged_files}; do if test -e $file; then echo 'Do not commit a CLAUDE.md. Write the rules in AGENTS.md.' >&2; exit 1; fi; done

# Every check but the tests. CI runs the tests.
pre-push:
  commands:
    check:
      run: npm run check:static

# After a pull or a branch switch: install changed dependencies, and copy the skills for Claude Code.
# A hook-level command gets no `{1}`, so the script compares the commits itself.
post-merge:
  commands:
    after-update:
      run: node scripts/afterUpdate.js ORIG_HEAD HEAD

post-checkout:
  commands:
    after-update:
      run: node scripts/afterUpdate.js {1} {2}
